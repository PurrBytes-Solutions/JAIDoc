jdk:
  distribution:
    download:
      # Directory where downloaded JDK distributions (for documenting non-running versions) are cached.
      directory: ${JDK_DIST_DOWNLOAD_DIR:./jdk-distributions}
    api:
      # Page size for Adoptium API requests.
      page.size: ${ADOPTIUM_PAGE_SIZE:50}
      # Maximum number of pages to fetch from Adoptium API.
      max.pages: ${ADOPTIUM_MAX_PAGES:6}

data:
  # Unified directory for both doclet output and ingest discovery.
  directory: ${DATA_DIR:./data}

doclet:
  work:
    directory: ${DOCLET_WORK_DIR:./jdk-doc-workspace}
  jar:
    # Directory containing JAIDoc-doclet.jar (passed to Javadoc via -docletpath).
    directory: ${DOCLET_JAR_DIR:./doclet}
  javadoc:
    # JDK home whose bin/javadoc runs the doclet. Empty = the running JDK (java.home).
    # Must be a JDK >= 17 (the doclet needs Jackson 3).
    home: ${DOCLET_JAVADOC_HOME:}
    # Timeout in seconds for the javadoc process.
    timeout: ${DOCLET_JAVADOC_TIMEOUT:600}
  # Comma-separated JDK modules to document. Empty = all modules found in the JDK's lib/src.zip.
  modules: ${DOCLET_MODULES:}

maven:
  # Base URL for Maven Central metadata and repository. Override for mirrors or proxies.
  metadata.url: ${MAVEN_METADATA_URL:https://repo1.maven.org/maven2/org/springframework/boot/spring-boot/maven-metadata.xml}
  repo.base: ${MAVEN_REPO_BASE:https://repo1.maven.org/maven2/org/springframework/boot/spring-boot}

spring:
  boot:
    artifacts:
      download:
        # Directory where downloaded Spring Boot artifacts (jar, sources) are cached.
        directory: ${SPRING_BOOT_ARTIFACTS_DIR:./spring-boot-artifacts}
