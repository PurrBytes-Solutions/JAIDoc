jdk:
  distribution:
    download:
      directory: target/test-jdk-distributions
    api:
      page.size: 50
      max.pages: 6
maven:
  metadata.url: https://repo1.maven.org/maven2/org/springframework/boot/spring-boot/maven-metadata.xml
  repo.base: https://repo1.maven.org/maven2/org/springframework/boot/spring-boot
spring:
  boot:
    artifacts:
      download:
        directory: target/test-spring-boot-artifacts
data:
  directory: target/data
doclet:
  work:
    directory: target/test-jdk-doc-workspace
  jar:
    directory: target/test-jdk-doc-workspace/doclet
